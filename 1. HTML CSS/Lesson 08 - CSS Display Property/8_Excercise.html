<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./8_Excercise.css" />
  </head>
  <body>
    <!-- 8a -->
    <input class="input-name" type="text" placeholder="Name" />
    <input class="input-email" type="email" placeholder="Email" />

    <!-- 8b -->
    <p class="para">
      Thanks for chatting with our customer support. Would you like to take our
      quick survey?
    </p>
    <button class="yes-btn">Yes</button>
    <button class="no-btn">No</button>

    <!-- 8c -->
    <img
      class="logo"
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8eNE3qKp5AXmY_iJXqmocEZ6Sg3fHNlCIK0qeRXZNOg&s=10"
      alt="Google-logo"
    />

    <input
      class="search-bar"
      type="text"
      placeholder="Search Google or type a URL"
    />

    <!-- 8d -->
    <input class="form first-name" type="text" placeholder="First name" />
    <input class="form last-name" type="text" placeholder="Last name" />
    <input class="form Email" type="email" placeholder="Email" />
    <button class="sign-up-btn">Sign Up</button>

    <!-- 8e  -->
    <p class="title">Request a ride now</p>
    <input class="form1" type="text" placeholder="Enter pickup location" />
    <input class="form1 destination-textbox" type="text" placeholder="Enter destination" />
    <button class=" btn Request-btn">Request now</button>
    <button class=" btn Schedule-btn">Schedule for later</button>
  </body>
</html>
