<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./9_Excercise.css" />
  </head>
  <body>
    <!-- 9a -->
    <div class="red-box"></div>

    <!-- 9b -->
    <div class="green-circle"></div>

    <!-- 9c -->
    <div class="wrapper">
      <p class="msg">Satisfied with our service?</p>
      <button class="btn">Yes</button>
      <button class="btn">No</button>
    </div>

    <!-- 9d -->
    <div class="yt-music">
      <p class="heading">Install YouTube Music</p>
      <p class="yt-msg">
        Add YouTube Music to your desktop for quick and easy access
      </p>
    </div>

    <!-- 9e -->
    <div class="tweet-space">
      <img
        class="pic4"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJUyqSP39MTMAMAc4mWJFh78C8voih6pnO-Q&s"
        alt="pic4"
      />
      <input class="t4" type="text" placeholder="What's happening?" />
      <button class="btn2">Tweet</button>
    </div>

    <!-- 9f , 9g-->
    <div class="card">
      <div>
        <img
          class="dp"
          src="https://i.pinimg.com/736x/26/4c/de/264cdeb1afafacbf883eeebe8b4e9248.jpg"
          alt=""
        />
      </div>
      <div class="info">
        <p class="name">Oliver</p>
        <p class="friend-sec">2 mutual friends</p>
        <button class="add-btn">Add Friend</button>
      </div>
    </div>

    <div class="card">
      <div>
        <img
          class="dp"
          src="https://i.pinimg.com/webp87/736x/b5/9e/33/b59e33c25ab08754aab6f2d4999b7fc6.webp"
          alt=""
        />
      </div>
      <div class="info">
        <p class="name">Mimi</p>
        <p class="friend-sec">3 mutual friends</p>
        <button class="add-btn">Add Friend</button>
      </div>
    </div>

    <div class="card">
      <div>
        <img
          class="dp"
          src="https://i.pinimg.com/webp87/736x/a0/1f/26/a01f26cc578c4159871ea05e528b3662.webp"
          alt=""
        />
      </div>
      <div class="info">
        <p class="name">Rex</p>
        <p class="friend-sec">4 mutual friends</p>
        <button class="add-btn">Add Friend</button>
      </div>
    </div>

    <!-- 9h -->
    <div class="google-card">
      <div>
        <img
          class="logo"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8eNE3qKp5AXmY_iJXqmocEZ6Sg3fHNlCIK0qeRXZNOg&s=10"
          alt="Google-logo"
        />
      </div>

      <div>
        <input
          class="search-bar"
          type="text"
          placeholder="Search Google or type a URL"
        />
      </div>

      <div >
        <button class="google-btn search-btn">Google Search</button>
        <button class="google-btn">I'm Feeling Lucky</button>
      </div>
    </div>
  </body>
</html>
