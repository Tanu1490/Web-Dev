<body>

    <!-- Block element - takes up the entire line . eg - <p> tag -->

    <!-- Inline-Block element - only takes up as much space as needed. eg : <img> , <input> etc. -->

    <!-- Inline element - appears within a line of text -->
  
     <input class="search-bar" type="text" placeholder="Search">

    <img class="thumbnail" src="https://supersimple.dev/exercises/youtube/thumbnails/thumbnail-1.webp" alt="Video thumbnail">

      Talking Tech <strong>and AI with</strong> Google CEO Sundar Pichai!
    </p>

      Marques Brownlee
    </p>

    </p>
