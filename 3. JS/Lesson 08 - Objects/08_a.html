    /*
    //--------------- These are Built in Objects--------------------

    //--------- 2 more  Built in Objects - > JSON, localStorage----------------

    /*
    -----------JSON Built-in Object-------------------- 
    - helps us work with JSON
    -Convert JS Object -> JSON

    ---------------JSON (JavaScript Object Notation)---------
     - a syntax
     -similar to JavaScript object
     -but has less features

     We use JSON 
     -Since JS syntax is only known to JS environment , JSON is more universal
     -when we send data between computers 
     -when we store data
    */

    /* 
    ----------------JSON.stringify()------------------- 
    -converts an object into a JSON string
    
    ----------------JSON.parse()----------------------- 
    -converts a JSON string back into a JavaScript object.
    */

    /*

    /*
    --------------localStorage-------------------------
    -saves value more permanently
    
    ---- localStorage.setItem('key','value')

    */

    //-----------Objects are references in js

    const obj1 = {   //obj1 points to mem. address where x and y are saved
        x:1,
        y:2
    };

    console.log(obj1);

    //------Copy by Reference -----------------
    const obj2 = obj1;  // now obj2 also points to same mem. address
    console.log(obj2.y);

    //even with const , value inside object can be changed 

    obj2.x = 67;       //nly value are changing not reference (address)
    console.log(obj2);

    const obj3 = {
        x:67,
        y:2
    };
    console.log(obj1 === obj3);  //both pointing to diff reference.
    console.log(obj1===obj2);    // both pointing to same ref.


    //-----------Shortcuts for Objects-------------------
    const obj4 = {
        msg:'Good Job',
        price:709
    };


    //---------------- Destructuring--------------------------
    // A shortcut to take values out of objects or arrays and put them into variables.
    
    // const msg = obj4.msg;    
    // when property and variable in which to save the value is same 
    const {msg,price} = obj4;
    console.log(msg);
    console.log(price);

    const obj5 = {
        //---Shorthand property--
        // msg : msg
        msg,

        //------Shorthand method----
        // fun: function fn(){
        //     console.log('this is function');
        // }

        fun(){
            console.log('this is function');
        }
    };

    console.log(msg);
    obj5.fun();
