<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Functions Excercise</title>
  </head>
  <body>
    <button class="start-Btn">Start</button>
    <br />
    <br />
    <button class="Cart-Btn">Add to cart</button>

    <p class="display-msg"></p>

    <button class="AddBtn">Add</button>

    <button class="DeleteBtn">Delete</button>

    <script>
      const add = function () {
        console.log(2 + 3);
      };

      add();
      add();
      // ----------------------------

      function runTwice(fun) {
        fun();
        fun();
      }

      runTwice(function () {
        console.log("12b");
      });

      runTwice(add);

      // --------------------------------

      document.querySelector(".start-Btn").addEventListener("click", () => {
        updateBtn();
      });

      document.querySelector(".Cart-Btn").addEventListener("click", () => {
        display();
      });

      document.querySelector(".AddBtn").addEventListener("click", () => {
        Messages++;
        updateNotification();
      });

      document.querySelector(".DeleteBtn").addEventListener("click", () => {
        if (Messages > 0) Messages--;
        updateNotification();
      });

      function updateBtn() {
        const StartBtnEle = document.querySelector(".start-Btn");

        // --next update
        StartBtnEle.innerHTML = "Loading..";

        setTimeout(() => {
          StartBtnEle.innerHTML = "Finished!";
        }, 1000);
      }

      // -------------------------------------
      let timeoutId;

      function display() {
        const AddBtnEle = document.querySelector(".display-msg");
        // --next update
        clearTimeout(timeoutId);

        AddBtnEle.innerHTML = "Added";

        timeoutId = setTimeout(() => {
          AddBtnEle.innerHTML = "";
        }, 2000);
      }
      // ----------------------------------------

      let Messages = 2;

      // this tells when page loads does notifi. already running
      let isDisplayingNotification = true;

      // this is for whenever message changes do below change
      function updateNotification() {
        if (Messages === 0) {
          clearInterval(intervalID); //this stops showing notif.
          document.title = "App";
          isDisplayingNotification = false;
        }

        if (Messages > 0) {
          if (isDisplayingNotification === false) {
            startNotification();
            isDisplayingNotification = true;
          }
        }
      }
      let intervalID;

      function startNotification() {
        intervalID = setInterval(function () {
          if (document.title === "App") {
            document.title = `(${Messages}) New Messages`;
          } else {
            document.title = "App";
          }
        }, 1000);
      }
    </script>
  </body>
</html>
