<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="styles/6.css" />
  </head>
  <body>
    <p class="Heading">Rock Paper Scissors</p>

    <button class="move-button js-Rock-btn">
      <img class="move-icon" src="Images/rock-emoji.png" alt="rock image" />
    </button>

    <button class="move-button js-Paper-btn">
      <img class="move-icon" src="./Images/paper-emoji.png" alt="paper image" />
    </button>

    <button class="move-button js-Scissors-btn">
      <img
        class="move-icon"
        src="./Images/scissors-emoji.png"
        alt="scissors image"
      />
    </button>

    <p class="result js-result"></p>
    <p class="scoreBtn js-moves"></p>
    <p class="score js-score"></p>

    <button class="resetBtn js-reset-btn">Reset Score</button>
    <button class="Auto-play-Btn js-autoplay-btn">Auto play</button>

    <div class="js-reset-confirmMsg"></div>

    <script src="scripts/6.js"></script>
  </body>
</html>
