<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="js-btn">Click</button>
    <script>
      const btnEle = document.querySelector(".js-btn");

      // .addEventListener() - lets us run some code when we interact with the element

      // takes 2 para - 1st event 2nd function to run when that event is triggered

      // it has some adv over using the attributes
      // it lets us add multiple event listeners for an event
      // we can remove an event listener

      const addEventListener = ()=>{
         console.log('click1');

      }
      btnEle.addEventListener('click',addEventListener);

      btnEle.addEventListener('click',()=>{
          console.log('clicked');
      })

      btnEle.removeEventListener('click',addEventListener);

      //two more method to loop through array - .filter() &.map()

      //         .filter()
      // 1. Creates a new array []
      // 2. return true, => put value in array
      // 3. return false, not put value in array
      //   Runs a function (callback) on each element
      //   Keeps only the elements where the function returns true

      console.log(
        [1, -3, 5].filter((value, index) => {
          // if(value >= 0 ) return true;
          // else return false;

          // shortcut for above
          return value >= 0;
        }),
      );

    //     .map()
    console.log([1,2,3].map((value,index)=>{
       return value*2;
    }));

    console.log([1,2,3].map(value => value*2));



    </script>
  </body>
</html>
