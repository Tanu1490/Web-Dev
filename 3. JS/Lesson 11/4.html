<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <script>
        const arr = ['hello' , 'world' , 'search' , 'good'];

        let result;
       function check(array){ 
        for(let i = 0 ; i < arr.length ; i++){
            if(arr[i] === 'search'){
                result = i;
                break;
            }else{
                result = -1;
            }
        }
        return result;
    }

    console.log(check(arr));



        
    </script>
</body>
