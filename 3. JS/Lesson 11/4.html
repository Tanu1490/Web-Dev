    <script>
      //  excercises
      const nums = [10, 20, 30];
      nums[2] = 99;

      console.log(nums);

      // -----------------------------------------
      function getLastValue(array) {
        const lastValue = array.length - 1;
        return array[lastValue];
      }

      console.log(getLastValue([1, 20, 22, 24, 5]));
      console.log(getLastValue(["hi", "hello", "good"]));

      // ------------------------------------------
      function arraySwap(array) {
        const lastValue = array.length - 1;

        let temp = array[0];
        array[0] = array[lastValue];
        array[lastValue] = temp;

        return array;
      }

      console.log(arraySwap([1, 20, 22, 24, 5]));
      console.log(arraySwap(["hi", "hello", "good"]));

      // -------------------------------------------

      for (let i = 0; i <= 10; i += 2) {
        console.log(i);
      }

      //--------------------------------------------
      for (let i = 5; i >= 0; i--) {
        console.log(i);
      }

      // -------------------------------------------
      let i = 0;
      while (i <= 10) {
        console.log(i);
        i += 2;
      }

      let j = 5;
      while (j >= 0) {
        console.log(j);
        j--;
      }
      //---------------------------------------------
      const arr = [1, 2, 3];
      const result = [];
      for (let i = 0; i < arr.length; i++) {
        result.push(arr[i] + 1);
      }

      console.log(result);

      // -------------------------------------------

      function addOne(array) {
        const result = [];
        for (let i = 0; i < array.length; i++) {
          result.push(array[i] + 1);
        }

        return result;
      }

      console.log(addOne([1, 2, 3]));
      console.log(addOne([-2, -1, 0, 99]));

      // -------------------------------------------

      function addNum(array, num) {
        const result = [];

        for (let i = 0; i < array.length; i++) {
          result.push(array[i] + num);
        }

        return result;
      }

      console.log(addNum([1, 2, 3],2));
      console.log(addNum([1, 2, 3],3));
      console.log(addNum([-2, -1, 0, 99],2));

      // -------------------------------------------
      function addArrays(array1 , array2){
        const  result = [];
        for(let i = 0 ; i < array1.length ; i++){
          result.push(array1[i] + array2[i]);
        }

        return result;
      }

      console.log(addArrays([1, 1, 2], [1, 1, 3]));
      console.log(addArrays([1, 2, 3], [4, 5, 6]));

      // ----------------------------------------------

      function countPositive(nums){
        let count = 0 ;
        for(let i = 0 ; i < nums.length ; i++){
          if( nums[i] > 0 ) count++ ;
        }

        return count;
      }

      console.log(countPositive([1,-3,5]));
      console.log(countPositive([-2,3,-5,7,10]));

      // --------------------------------------------

      function minMax(nums){
        const result = {
          min : nums[0],
          max : nums[0]
        }

        for(let i = 0 ; i < nums.length ; i++){
          if(nums[i] < result.min) result.min = nums[i];
          else if(nums[i] > result.max) result.max  = nums[i];
        }

        return result;
      }

      console.log(minMax([1,-3,5]));
      console.log(minMax([-2,3,-5,7,10]));

      // --------------------------------------------------

      function minMax(nums){
        const result = {
          min : null,
          max : null
        }

        // if(nums.length === 1) {
        //   result.min = nums[0];
        //   result.max = nums[0];
        // };

        for(let i = 0 ; i < nums.length ; i++){
          // if(nums[i] < result.min) result.min = nums[i];
          // else if(nums[i] > result.max) result.max  = nums[i];

          if(result.min === null ||nums[i] < result.min) result.min = nums[i];
          
          if( result.max === null ||nums[i] > result.max) result.max  = nums[i];
        }

        return result;
      }

      console.log(minMax([]));
      console.log(minMax([3]));

      // -------------------------------------------------------
      function countWords(words){
        const result = {};


        for(let i = 0 ; i < words.length ; i++){
          if( !Object.hasOwn(result,words[i])){
            result[words[i]] = 1;
          }else{
            result[words[i]] += 1;
          }
        
          
          // result[word] adds/accesses a property using whatever is
          // saved inside the 'word' variable.
          
          // if (!result[word]) {
          //   result[word] = 1;
          // } else {
          //   result[word]++;
          // }
            
        }

        return result;
      }

      console.log(countWords(['apple','grape','apple','apple']));
