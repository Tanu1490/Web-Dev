      //-----Falsy Values-----
      // false 0 '' NaN undefined null
      // Any value not on this list is truthy

      // ternary operator   
      const result = 0 ? 'truthy' : 'falsy';
      console.log(result);

      //-----------Guard operator -  AND operator  &&-------------
      // value1 && value2  - && checks both side 
      // false && value2  - it is impossible for both sides to be truthy so it stops early and doesn't even run the code on right
      // so  we can use the value on left to block / guard the code on right  
      false && console.log('hello');

      const message = 5 && 'hello';
      console.log(message);


      // Default operator - OR operator || 
      // value1 && value2  - || checks if at least 1 side is truthy 
      // we can use || to set default value
      const currency = undefined || 'USD';
      console.log(currency);
