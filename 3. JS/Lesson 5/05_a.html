<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variables</title>
  </head>
  <body>
    <script>
      // All about variables

      let var1 = 7;
      console.log(var1);

      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 10);

      const result = calculation + 2;
      console.log(result);

      const msg = "Hey jake";
      console.log(msg);

      var1 = 13;
      console.log(var1);

      var1 = var1 + 10;
      console.log(var1); 

      const var2 = 56;
        // var2 = 78;   //gives error 

        // Best practice = use const by default
        // (only use let when we need to change the variable)

      var score = 90;  //not used in new js

      console.log(typeof score);
    </script>
  </body>
</html>
